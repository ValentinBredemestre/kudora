name: Business E2E

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run three-validator business acceptance suite
        env:
          E2E_BUILD_CACHE_FROM: --cache-from=type=gha,scope=kudora-e2e
          E2E_BUILD_CACHE_TO: --cache-to=type=gha,mode=max,scope=kudora-e2e
        run: make e2e

      - name: Stop E2E network
        if: always()
        run: make e2e-down
